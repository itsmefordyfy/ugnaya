<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#F8FAFC;font-family:Inter,Arial,sans-serif;color:#0F172A">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#FFFFFF;border-radius:16px;padding:32px">
      <tr><td>
        <h1 style="margin:0 0 16px;font-size:22px">Confirm your UGNAYA account</h1>
        <p style="margin:0 0 24px;font-size:16px;line-height:24px">Tap the button to confirm your email and finish registering your business.</p>
        <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email&next=/register"
           style="display:inline-block;background:#1E2A78;color:#FFFFFF;text-decoration:none;font-weight:600;padding:12px 24px;border-radius:999px">Confirm my email</a>
        <p style="margin:24px 0 0;font-size:12px;line-height:16px;color:#475569">If you didn't sign up for UGNAYA, you can ignore this email.</p>
      </td></tr>
    </table>
  </body>
</html>
